name: OpenWrt R4S minimal

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-setuptools rsync unzip zlib1g-dev file wget libelf-dev python3-dev python3-pyelftools python3-yaml ccache zstd

      - name: Download official source and feeds
        run: |
          git clone --depth 1 --branch v25.12.6 https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure R4S
        working-directory: openwrt
        run: |
          printf '%s\n' \
            'CONFIG_TARGET_rockchip=y' \
            'CONFIG_TARGET_rockchip_armv8=y' \
            'CONFIG_TARGET_rockchip_armv8_DEVICE_friendlyarm_nanopi-r4s=y' \
            'CONFIG_TARGET_ROOTFS_PARTSIZE=2048' \
            '# CONFIG_TARGET_ROOTFS_EXT4FS is not set' \
            'CONFIG_TARGET_ROOTFS_SQUASHFS=y' \
            'CONFIG_PACKAGE_luci=y' \
            'CONFIG_PACKAGE_luci-i18n-base-zh-cn=y' > .config
          make defconfig
          grep -qx 'CONFIG_TARGET_ROOTFS_PARTSIZE=2048' .config
          grep -qx 'CONFIG_TARGET_rockchip_armv8_DEVICE_friendlyarm_nanopi-r4s=y' .config
          grep -qx 'CONFIG_PACKAGE_luci-i18n-base-zh-cn=y' .config

      - name: Compile firmware
        working-directory: openwrt
        run: |
          make download -j2
          make -j"$(nproc)" || make -j1 V=s

      - name: Prepare firmware
        working-directory: openwrt/bin/targets/rockchip/armv8
        run: |
          shopt -s nullglob
          images=(*friendlyarm_nanopi-r4s-squashfs-sysupgrade.img.gz)
          test "${#images[@]}" -eq 1
          sha256sum "${images[@]}" > r4s-sha256sums

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-25.12.6-r4s
          path: |
            openwrt/bin/targets/rockchip/armv8/*friendlyarm_nanopi-r4s-squashfs-sysupgrade.img.gz
            openwrt/bin/targets/rockchip/armv8/r4s-sha256sums
          if-no-files-found: error

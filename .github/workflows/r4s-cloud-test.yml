name: R4S userspace cloud test
on:
  push:
    branches: [r4s-cloud-test]
permissions:
  actions: read
  contents: read
jobs:
  emulate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download original R4S build
        uses: actions/download-artifact@v4
        with:
          name: openwrt-25.12.6-r4s
          run-id: 44013802701
          github-token: ${{ github.token }}
      - name: Install emulator and extraction tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y qemu-system-arm squashfs-tools cpio fdisk
      - name: Prepare R4S userspace and generic kernel
        run: |
          set -euxo pipefail
          image=openwrt-rockchip-armv8-friendlyarm_nanopi-r4s-squashfs-sysupgrade.img.gz
          echo "291b251e1c3ee346942496c15ef5c06137e01a858f6dd96ed4087c3722f800e5  $image" | sha256sum -c -
          gzip -dc "$image" > r4s.img
          sfdisk --json r4s.img > partition.json
          offset=$(jq -r '.partitiontable.partitions[1].start * 512' partition.json)
          sudo unsquashfs -o "$offset" -d rootfs r4s.img
          sudo sh -c 'cd rootfs && find . -print0 | cpio --null -o --format=newc | gzip > ../rootfs.cpio.gz'
          curl -fsSL https://downloads.openwrt.org/releases/25.12.6/targets/armsr/armv8/openwrt-25.12.6-armsr-armv8-generic-kernel.bin -o kernel.bin
          echo '2b9ce48df5536e993ee691339057828488e4a31be9c2bb5d3f6120f1135fcbb0  kernel.bin' | sha256sum -c -
      - name: Run R4S userspace under generic ARM kernel
        run: |
          set -uo pipefail
          { sleep 30; printf '%s\n' 'echo R4S_SHELL_OK' 'cat /etc/openwrt_release' 'apk --version && echo R4S_APK_OK' 'test -e /www/cgi-bin/luci && echo R4S_LUCI_OK' 'find /usr/share -iname "*zh*hans*" | head' 'echo R4S_TEST_DONE' 'poweroff -f'; sleep 5; } | timeout 120 qemu-system-aarch64 -machine virt -cpu cortex-a57 -m 512 -nographic -no-reboot -kernel kernel.bin -initrd rootfs.cpio.gz -append 'console=ttyAMA0 rdinit=/bin/sh' 2>&1 | tee qemu.log || true
          grep -q '^R4S_SHELL_OK' qemu.log && grep -q '^R4S_APK_OK' qemu.log && grep -q '^R4S_LUCI_OK' qemu.log && grep -q '^R4S_TEST_DONE' qemu.log
